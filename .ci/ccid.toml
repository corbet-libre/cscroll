schema = 1
project = "cscroll"

# Legacy selector preserved verbatim from canonical HEAD so the existing
# `.crow/ccid.yaml` (CHECKS default `ipc`) keeps working. The default
# `verify` job below runs ALL original gates (runtime + ipc + manifest +
# source-boundary); `ipc` remains callable for the legacy workflow.
[checks.ipc]
kind = "commands"
commands = [["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_swayipc_compat.py", "-v"]]

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["python3", "--version"], ["nix", "--version"], ["moon", "--version"], ["proto", "--version"]]

[render]
tool_revision = "3bd0c9a089abd341f65f7cabd44cf608e8400b03"
tool_sha256 = "c1467201662056492c89968ad2c38bcd6eef30e1359466a54bac978cacbca9b3"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
